name: Supply chain inventory and scan

on:
  push:
    paths:
      - "Framework/**"
      - "Solutions/**"
      - "Services/**"
      - "MSFront/package.json"
      - "MSFront/yarn.lock"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/supply-chain.yml"
  pull_request:
    paths:
      - "Framework/**"
      - "Solutions/**"
      - "Services/**"
      - "MSFront/package.json"
      - "MSFront/yarn.lock"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: goexample-sbom.cyclonedx.json
          artifact-name: goexample-sbom.cyclonedx.json
          upload-release-assets: false

      - name: Scan SBOM for high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: goexample-sbom.cyclonedx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
