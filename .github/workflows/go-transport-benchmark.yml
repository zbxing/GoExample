name: Go transport benchmark evidence

on:
  push:
    branches:
      - "master"
    paths:
      - "Framework/**"
      - "Solutions/Example/**"
      - "scripts/go-project.mjs"
      - "scripts/transport-benchmark-baseline.mjs"
      - "scripts/transport-benchmark-report.mjs"
      - "scripts/transport-soak-report.mjs"
      - "scripts/evidence-manifest.mjs"
      - "scripts/evidence-verify.mjs"
      - "__test__/node/transport-benchmark-baseline.test.mjs"
      - "__test__/node/transport-benchmark-report.test.mjs"
      - "__test__/node/transport-soak-report.test.mjs"
      - "package.json"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/go-transport-benchmark.yml"
  pull_request:
    paths:
      - "Framework/**"
      - "Solutions/Example/**"
      - "scripts/go-project.mjs"
      - "scripts/transport-benchmark-baseline.mjs"
      - "scripts/transport-benchmark-report.mjs"
      - "scripts/transport-soak-report.mjs"
      - "scripts/evidence-manifest.mjs"
      - "scripts/evidence-verify.mjs"
      - "__test__/node/transport-benchmark-baseline.test.mjs"
      - "__test__/node/transport-benchmark-report.test.mjs"
      - "__test__/node/transport-soak-report.test.mjs"
      - "package.json"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/go-transport-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-transport-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-baseline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Discover latest trusted benchmark baseline
        id: benchmark-baseline
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const branch = context.payload.repository.default_branch;
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'go-transport-benchmark.yml',
              branch,
              status: 'success',
              per_page: 50,
            });
            for (const run of response.data.workflow_runs) {
              const trusted = run.id !== context.runId
                && run.head_branch === branch
                && run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`
                && ['push', 'workflow_dispatch'].includes(run.event);
              if (!trusted) continue;
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );
              const prefix = `go-transport-benchmark-${run.id}-`;
              const artifact = artifacts.find((item) => !item.expired && item.name.startsWith(prefix));
              if (!artifact) continue;
              core.setOutput('run-id', String(run.id));
              core.setOutput('head-sha', run.head_sha);
              core.setOutput('head-branch', run.head_branch);
              core.setOutput('event', run.event);
              core.setOutput('artifact-name', artifact.name);
              core.notice(`Selected trusted benchmark baseline run ${run.id} (${run.head_sha}).`);
              return;
            }
            core.notice('No trusted successful default-branch benchmark artifact is available yet.');

      - name: Download trusted benchmark baseline artifact
        id: download-benchmark-baseline
        if: steps.benchmark-baseline.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ steps.benchmark-baseline.outputs.artifact-name }}
          path: .temp/transport-baseline-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.benchmark-baseline.outputs.run-id }}

      - name: Prepare trusted benchmark baseline
        if: steps.benchmark-baseline.outputs.run-id != '' && steps.download-benchmark-baseline.outcome == 'success'
        run: >-
          node scripts/transport-benchmark-baseline.mjs prepare
          --candidate .temp/transport-baseline-artifact/baseline-candidate.json
          --output .temp/transport-benchmark/baseline.json
          --provenance .temp/transport-benchmark/baseline-source.json
          --repository "${{ github.repository }}"
          --run-id "${{ steps.benchmark-baseline.outputs.run-id }}"
          --head-sha "${{ steps.benchmark-baseline.outputs.head-sha }}"
          --head-branch "${{ steps.benchmark-baseline.outputs.head-branch }}"
          --event "${{ steps.benchmark-baseline.outputs.event }}"
          --artifact-name "${{ steps.benchmark-baseline.outputs.artifact-name }}"

      - name: Record unavailable trusted benchmark baseline
        if: steps.benchmark-baseline.outputs.run-id == ''
        run: >-
          node scripts/transport-benchmark-baseline.mjs unavailable
          --output .temp/transport-benchmark/baseline.json
          --provenance .temp/transport-benchmark/baseline-source.json
          --reason no_trusted_successful_run

      - name: Record benchmark baseline download failure
        if: steps.benchmark-baseline.outputs.run-id != '' && steps.download-benchmark-baseline.outcome != 'success'
        run: >-
          node scripts/transport-benchmark-baseline.mjs unavailable
          --output .temp/transport-benchmark/baseline.json
          --provenance .temp/transport-benchmark/baseline-source.json
          --reason artifact_download_failed

      - name: Upload trusted benchmark baseline selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-transport-baseline-${{ github.run_id }}
          path: |
            .temp/transport-benchmark/baseline.json
            .temp/transport-benchmark/baseline-source.json
          if-no-files-found: error
          retention-days: 1

  transport-benchmark:
    needs: trusted-baseline
    if: always() && (needs.trusted-baseline.result == 'success' || needs.trusted-baseline.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache-dependency-path: |
            Framework/go.sum
            Solutions/Example/go.sum

      - name: Download prepared trusted benchmark baseline
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: trusted-transport-baseline-${{ github.run_id }}
          path: .temp/transport-benchmark

      - name: Record pull request baseline exclusion
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/transport-benchmark-baseline.mjs unavailable
          --output .temp/transport-benchmark/baseline.json
          --provenance .temp/transport-benchmark/baseline-source.json
          --reason pull_request_not_eligible

      - name: Capture runner environment
        shell: bash
        run: |
          mkdir -p .temp/transport-benchmark
          {
            echo "captured_at=$(date --utc --iso-8601=seconds)"
            echo "commit=$(git rev-parse HEAD)"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "gomaxprocs=2"
            uname -a
            cat /etc/os-release
            lscpu
            go version
            go env GOOS GOARCH GOVERSION
            yarn --version
          } | tee .temp/transport-benchmark/environment.txt

      - name: Capture system state before benchmark
        shell: bash
        run: |
          {
            echo "captured_at=$(date --utc --iso-8601=seconds)"
            echo "open_file_limit=$(ulimit -n)"
            echo "kernel_file_table=$(cat /proc/sys/fs/file-nr)"
            echo "--- socket summary ---"
            ss -s
            echo "--- network devices ---"
            cat /proc/net/dev
            echo "--- memory ---"
            grep -E '^(MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapTotal|SwapFree):' /proc/meminfo
          } | tee .temp/transport-benchmark/system-before.txt

      - name: Run real-TCP transport contract and five benchmark rounds
        shell: bash
        run: |
          set +e
          GOMAXPROCS=2 /usr/bin/time -v yarn bench:transports 2>&1 \
            | tee .temp/transport-benchmark/transport-benchmark.txt
          benchmark_status=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "${benchmark_status}" \
            | tee .temp/transport-benchmark/benchmark-status.txt
          exit "${benchmark_status}"

      - name: Run bounded transport soak
        if: always()
        shell: bash
        run: |
          set +e
          TRANSPORT_SOAK_DURATION=30s GOMAXPROCS=2 /usr/bin/time -v \
            yarn soak:transports 2>&1 \
            | tee .temp/transport-benchmark/transport-soak.txt
          soak_status=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "${soak_status}" \
            | tee .temp/transport-benchmark/soak-status.txt
          exit "${soak_status}"

      - name: Capture system state after benchmark
        if: always()
        shell: bash
        run: |
          {
            echo "captured_at=$(date --utc --iso-8601=seconds)"
            echo "open_file_limit=$(ulimit -n)"
            echo "kernel_file_table=$(cat /proc/sys/fs/file-nr)"
            echo "--- socket summary ---"
            ss -s
            echo "--- network devices ---"
            cat /proc/net/dev
            echo "--- memory ---"
            grep -E '^(MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapTotal|SwapFree):' /proc/meminfo
          } | tee .temp/transport-benchmark/system-after.txt

      - name: Extract benchmark trend input
        if: always()
        shell: bash
        run: |
          grep -E '^BenchmarkProjectTransportTCP(Parallel)?/' \
            .temp/transport-benchmark/transport-benchmark.txt \
            | tee .temp/transport-benchmark/benchmark-trend.txt
          test -s .temp/transport-benchmark/benchmark-trend.txt

      - name: Generate capacity report
        if: always()
        shell: bash
        env:
          GOMAXPROCS: "2"
          TRANSPORT_BENCHMARK_GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          baseline_args=()
          if [[ -f .temp/transport-benchmark/baseline.json ]]; then
            baseline_args+=(--baseline .temp/transport-benchmark/baseline.json)
          fi
          node scripts/transport-benchmark-report.mjs \
            --input .temp/transport-benchmark/transport-benchmark.txt \
            --output .temp/transport-benchmark/transport-capacity-report.json \
            "${baseline_args[@]}"

      - name: Preserve capacity baseline candidate
        if: always() && hashFiles('.temp/transport-benchmark/transport-capacity-report.json') != ''
        shell: bash
        run: cp .temp/transport-benchmark/transport-capacity-report.json .temp/transport-benchmark/baseline-candidate.json

      - name: Generate soak report
        if: always()
        shell: bash
        run: |
          node scripts/transport-soak-report.mjs \
            --input .temp/transport-benchmark/transport-soak.txt \
            --output .temp/transport-benchmark/transport-soak-report.json

      - name: Summarize CPU and heap profiles
        if: always()
        shell: bash
        run: |
          if [[ -f .temp/transport-benchmark/transport.cpu.pprof ]]; then
            go tool pprof -top -nodecount=30 \
              .temp/transport-benchmark/transport.cpu.pprof \
              > .temp/transport-benchmark/cpu-profile-top.txt 2>&1
          fi
          if [[ -f .temp/transport-benchmark/transport.heap.pprof ]]; then
            go tool pprof -top -nodecount=30 -sample_index=alloc_space \
              .temp/transport-benchmark/transport.heap.pprof \
              > .temp/transport-benchmark/heap-profile-top.txt 2>&1
          fi

      - name: Generate evidence manifest
        if: always()
        shell: bash
        run: yarn evidence:manifest --output .temp/transport-benchmark/manifest.json

      - name: Verify evidence manifest
        if: always()
        shell: bash
        run: yarn evidence:verify --manifest .temp/transport-benchmark/manifest.json

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-transport-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/transport-benchmark
          if-no-files-found: error
          retention-days: 30
