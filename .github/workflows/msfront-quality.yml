name: MSFront quality

on:
  push:
    paths:
      - "MSFront/**"
      - "docs/openapi/**"
      - "scripts/msfront.mjs"
      - "__test__/contract/msfront-route-authorization.mjs"
      - "package.json"
      - ".github/workflows/msfront-quality.yml"
  pull_request:
    paths:
      - "MSFront/**"
      - "docs/openapi/**"
      - "scripts/msfront.mjs"
      - "__test__/contract/msfront-route-authorization.mjs"
      - "package.json"
      - ".github/workflows/msfront-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msfront-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: msfront-ci-password
          POSTGRES_DB: msfront_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d msfront_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: MSFront
    env:
      MSFRONT_JWT_SECRET: ci-only-msfront-jwt-secret-32-characters
      MSFRONT_DATABASE_URL: postgres://postgres:msfront-ci-password@localhost:5432/msfront_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: MSFront/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: PostgreSQL migration integration
        run: yarn test:database

      - name: Audit production dependencies
        run: yarn audit --registry https://registry.npmjs.org --groups dependencies --level high

      - name: Lint
        run: yarn lint

      - name: Route authorization contract
        run: yarn test

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build
