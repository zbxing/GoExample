name: MSFront quality

on:
  push:
    paths:
      - "MSFront/**"
      - "docs/openapi/**"
      - "scripts/msfront.mjs"
      - "__test__/contract/msfront-route-authorization.mjs"
      - "package.json"
      - ".github/workflows/msfront-quality.yml"
  pull_request:
    paths:
      - "MSFront/**"
      - "docs/openapi/**"
      - "scripts/msfront.mjs"
      - "__test__/contract/msfront-route-authorization.mjs"
      - "package.json"
      - ".github/workflows/msfront-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msfront-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MSFront
    env:
      MSFRONT_JWT_SECRET: ci-only-msfront-jwt-secret-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: MSFront/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Audit production dependencies
        run: yarn audit --registry https://registry.npmjs.org --groups dependencies --level high

      - name: Lint
        run: yarn lint

      - name: Route authorization contract
        run: yarn test

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build
