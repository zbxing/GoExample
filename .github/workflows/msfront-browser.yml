name: MSFront browser

on:
  push:
    paths:
      - "MSFront/**"
      - "__test__/e2e/msfront/**"
      - "scripts/e2e-msfront.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/msfront-browser.yml"
  pull_request:
    paths:
      - "MSFront/**"
      - "__test__/e2e/msfront/**"
      - "scripts/e2e-msfront.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/msfront-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msfront-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      MSFRONT_JWT_SECRET: ci-only-msfront-jwt-secret-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            MSFront/yarn.lock

      - name: Install root tooling
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install MSFront dependencies
        run: yarn install --frozen-lockfile --non-interactive
        working-directory: MSFront

      - name: Build production frontend
        run: yarn build:front

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run browser E2E and accessibility gates
        run: yarn test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msfront-playwright-report
          path: __test__/reports/playwright
          if-no-files-found: warn
          retention-days: 14
