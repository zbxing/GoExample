name: Framework and Go projects quality

on:
  push:
    paths:
      - "Framework/**"
      - "Solutions/**"
      - "Services/**"
      - "SDK/**"
      - "support/consumer/**"
      - "contracts/**"
      - "docs/openapi/**"
      - "docs/recovery/**"
      - "go.work"
      - "go.work.sum"
      - "scripts/go-project.mjs"
      - "scripts/go-sdk.mjs"
      - "scripts/project-contracts.mjs"
      - "scripts/lib/project-contracts.mjs"
      - "scripts/lib/release-provenance.mjs"
      - "scripts/lib/authorization-evidence.mjs"
      - "scripts/lib/oidc-browser-evidence.mjs"
      - "scripts/lib/nats-cluster-evidence.mjs"
      - "scripts/lib/nats-restart-evidence.mjs"
      - "scripts/lib/nats-snapshot-evidence.mjs"
      - "scripts/lib/postgres-recovery-evidence.mjs"
      - "scripts/nats-cluster-evidence.mjs"
      - "scripts/nats-restart-evidence.mjs"
      - "scripts/nats-snapshot-evidence.mjs"
      - "scripts/authorization-evidence.mjs"
      - "scripts/oidc-browser-evidence.mjs"
      - "scripts/postgres-recovery-contract.mjs"
      - "scripts/postgres-recovery-evidence.mjs"
      - "scripts/postgres-recovery-report.mjs"
      - "scripts/redis-sentinel-contract.mjs"
      - "scripts/server-recovery-drill.mjs"
      - "scripts/server-release.mjs"
      - "scripts/evidence-manifest.mjs"
      - "scripts/evidence-verify.mjs"
      - "__test__/node/postgres-recovery-report.test.mjs"
      - "__test__/node/postgres-recovery-evidence.test.mjs"
      - "__test__/node/nats-cluster-evidence.test.mjs"
      - "__test__/node/nats-restart-evidence.test.mjs"
      - "__test__/node/nats-snapshot-evidence.test.mjs"
      - "__test__/node/authorization-evidence.test.mjs"
      - "__test__/node/oidc-browser-evidence.test.mjs"
      - "__test__/node/release-provenance.test.mjs"
      - "__test__/node/server-release.test.mjs"
      - "docs/recovery/server-failure-matrix.md"
      - "package.json"
      - ".github/workflows/go-quality.yml"
  pull_request:
    paths:
      - "Framework/**"
      - "Solutions/**"
      - "Services/**"
      - "SDK/**"
      - "support/consumer/**"
      - "contracts/**"
      - "docs/openapi/**"
      - "docs/recovery/**"
      - "go.work"
      - "go.work.sum"
      - "scripts/go-project.mjs"
      - "scripts/go-sdk.mjs"
      - "scripts/project-contracts.mjs"
      - "scripts/lib/project-contracts.mjs"
      - "scripts/lib/release-provenance.mjs"
      - "scripts/lib/authorization-evidence.mjs"
      - "scripts/lib/oidc-browser-evidence.mjs"
      - "scripts/lib/nats-cluster-evidence.mjs"
      - "scripts/lib/nats-restart-evidence.mjs"
      - "scripts/lib/nats-snapshot-evidence.mjs"
      - "scripts/lib/postgres-recovery-evidence.mjs"
      - "scripts/nats-cluster-evidence.mjs"
      - "scripts/nats-restart-evidence.mjs"
      - "scripts/nats-snapshot-evidence.mjs"
      - "scripts/authorization-evidence.mjs"
      - "scripts/oidc-browser-evidence.mjs"
      - "scripts/postgres-recovery-contract.mjs"
      - "scripts/postgres-recovery-evidence.mjs"
      - "scripts/postgres-recovery-report.mjs"
      - "scripts/redis-sentinel-contract.mjs"
      - "scripts/server-recovery-drill.mjs"
      - "scripts/server-release.mjs"
      - "scripts/evidence-manifest.mjs"
      - "scripts/evidence-verify.mjs"
      - "__test__/node/postgres-recovery-report.test.mjs"
      - "__test__/node/postgres-recovery-evidence.test.mjs"
      - "__test__/node/nats-cluster-evidence.test.mjs"
      - "__test__/node/nats-restart-evidence.test.mjs"
      - "__test__/node/nats-snapshot-evidence.test.mjs"
      - "__test__/node/authorization-evidence.test.mjs"
      - "__test__/node/oidc-browser-evidence.test.mjs"
      - "__test__/node/release-provenance.test.mjs"
      - "__test__/node/server-release.test.mjs"
      - "docs/recovery/server-failure-matrix.md"
      - "package.json"
      - ".github/workflows/go-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.workspace.outputs.modules }}
      projects: ${{ steps.workspace.outputs.projects }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify generated Go SDK
        run: |
          node scripts/project-contracts.mjs materialize --fetch
          node scripts/project-contracts.mjs check
          node scripts/go-sdk.mjs check

      - name: Discover workspace modules
        id: workspace
        shell: bash
        run: |
          workspace="$(go work edit -json)"
          modules="$(jq -c '[.Use[].DiskPath]' <<<"${workspace}")"
          projects="$(jq -c '[.Use[].DiskPath | select(startswith("./Solutions/") or startswith("./Services/"))]' <<<"${workspace}")"
          test "$(jq 'length' <<<"${modules}")" -gt 0
          test "$(jq 'length' <<<"${projects}")" -gt 0
          echo "modules=${modules}" >> "${GITHUB_OUTPUT}"
          echo "projects=${projects}" >> "${GITHUB_OUTPUT}"

  module-quality:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum

      - name: Set up Node
        if: startsWith(matrix.module, './Solutions/') || startsWith(matrix.module, './Services/')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Materialize pinned project OpenAPI contracts
        if: startsWith(matrix.module, './Solutions/') || startsWith(matrix.module, './Services/')
        run: node scripts/project-contracts.mjs materialize --fetch

      - name: Check Framework public API compatibility
        if: matrix.module == './Framework'
        shell: bash
        env:
          FRAMEWORK_API_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(run ./Framework/internal/apisnapshot -root Framework -baseline Framework/api-snapshot.json)
          if [[ -n "${FRAMEWORK_API_BASE_REF}" ]] && git cat-file -e "${FRAMEWORK_API_BASE_REF}:Framework/api-snapshot.json"; then
            args+=(-baseline-ref "${FRAMEWORK_API_BASE_REF}")
          elif [[ -n "${FRAMEWORK_API_BASE_REF}" ]]; then
            echo "Target branch has no Framework API snapshot; validating the bootstrap snapshot only."
          fi
          go "${args[@]}"

      - name: Test
        run: go -C "${{ matrix.module }}" test ./...

      - name: Verify downloaded modules
        run: go -C "${{ matrix.module }}" mod verify

      - name: Race detector
        run: go -C "${{ matrix.module }}" test -race ./...

      - name: Vet
        run: go -C "${{ matrix.module }}" vet ./...

      - name: Vulnerability scan
        run: go -C "${{ matrix.module }}" run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  project-build:
    needs: [discover, module-quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache-dependency-path: ${{ matrix.project }}/go.sum

      - name: Build
        run: go -C "${{ matrix.project }}" build -trimpath -o "${RUNNER_TEMP}/server" ./cmd/server

      - name: Docker build and health smoke
        if: ${{ hashFiles(format('{0}/Dockerfile', matrix.project)) != '' }}
        shell: bash
        run: |
          image="goexample-smoke:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -f "${{ matrix.project }}/Dockerfile" -t "${image}" .
          container="$(docker run --detach --publish 127.0.0.1:3001:3001 "${image}")"
          cleanup() {
            docker logs "${container}" || true
            docker rm --force "${container}" || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/livez >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/readyz >/dev/null

  postgres-contract:
    needs: module-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache-dependency-path: Framework/go.sum

      - name: Run real PostgreSQL serialization, lock, and recovery contracts
        id: postgres-contract
        run: yarn postgres:recovery:contract

      - name: Verify PostgreSQL recovery contract evidence
        if: always()
        run: yarn postgres:recovery:contract:verify

      - name: Generate PostgreSQL evidence manifest
        if: always()
        run: >-
          node scripts/evidence-manifest.mjs
          --output .temp/workflow-artifacts/postgres-recovery-contract/manifest.json

      - name: Verify PostgreSQL evidence manifest
        if: always()
        run: >-
          node scripts/evidence-verify.mjs
          --manifest .temp/workflow-artifacts/postgres-recovery-contract/manifest.json

      - name: Upload PostgreSQL contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-recovery-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/postgres-recovery-contract
          if-no-files-found: error
          retention-days: 30

  nats-contract:
    needs: module-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Start pinned NATS JetStream
        shell: bash
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          image="nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da"
          mkdir -p "${artifact_dir}" ".temp/nats-server-bin"
          docker run --detach --name goexample-nats-contract --publish 4222:4222 "${image}" -js -sd /data > "${artifact_dir}/container-id.txt"
          docker cp goexample-nats-contract:/nats-server .temp/nats-server-bin/nats-server
          chmod 0755 .temp/nats-server-bin/nats-server
          sha256sum .temp/nats-server-bin/nats-server > "${artifact_dir}/nats-server-binary.sha256"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache-dependency-path: Framework/go.sum

      - name: Run real NATS and JetStream delivery contracts
        id: nats-contract
        shell: bash
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
          NATS_SERVER_BINARY: ${{ github.workspace }}/.temp/nats-server-bin/nats-server
          NATS_DELIVERY_EVIDENCE_DIR: ${{ github.workspace }}/.temp/workflow-artifacts/nats-contract/delivery
          NATS_RESTART_EVIDENCE_DIR: ${{ github.workspace }}/.temp/workflow-artifacts/nats-contract/restart
          NATS_CLUSTER_EVIDENCE_DIR: ${{ github.workspace }}/.temp/workflow-artifacts/nats-contract/cluster
          NATS_SNAPSHOT_EVIDENCE_DIR: ${{ github.workspace }}/.temp/workflow-artifacts/nats-contract/snapshot
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          mkdir -p "${artifact_dir}"
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          nats_server_sha256="$(cut -d ' ' -f 1 "${artifact_dir}/nats-server-binary.sha256")"
          {
            echo "contract=nats-jetstream-snapshot-restore"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "platform=$(node -p 'process.platform')"
            echo "architecture=$(node -p 'process.arch')"
            echo "node=$(node --version)"
            echo "go=$(go version)"
            echo "docker=$(docker version --format '{{.Server.Version}}')"
            echo "git_commit=${GITHUB_SHA}"
            echo "nats_image=nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da"
            echo "nats_server_sha256=${nats_server_sha256}"
            echo "jetstream_enabled=true"
            echo "storage=file-stream"
            echo "target_nats_broker=not_recorded"
            echo "rpo_rto=not_approved"
            echo "started_at=${started_at}"
          } > "${artifact_dir}/environment.txt"
          set +e
          set -o pipefail
          go -C Framework test -v -count=1 -timeout=2m -run '^TestRealNATS' ./queueclient/... 2>&1 | tee "${artifact_dir}/test-output.txt"
          status="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=${status}" > "${artifact_dir}/test-status.txt"
          echo "ended_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "${artifact_dir}/environment.txt"
          exit "${status}"

      - name: Collect NATS contract evidence
        if: always()
        shell: bash
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          mkdir -p "${artifact_dir}"
          docker logs goexample-nats-contract > "${artifact_dir}/nats-server.log" 2>&1 || true
          docker inspect goexample-nats-contract > "${artifact_dir}/nats-server-inspect.json" 2>&1 || true
          docker rm --force goexample-nats-contract > "${artifact_dir}/cleanup.txt" 2>&1 || true

      - name: Prepare NATS delivery evidence context
        if: always()
        shell: bash
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          delivery_dir="${artifact_dir}/delivery"
          mkdir -p "${delivery_dir}"
          for name in environment.txt test-output.txt test-status.txt nats-server.log; do
            if [[ -f "${artifact_dir}/${name}" ]]; then
              cp "${artifact_dir}/${name}" "${delivery_dir}/${name}"
            fi
          done
          if [[ -f "${delivery_dir}/environment.txt" ]]; then
            sed -i '1s/^contract=.*/contract=nats-jetstream-delivery-lease/' "${delivery_dir}/environment.txt"
          fi
          if [[ -f .temp/nats-server-bin/nats-server ]]; then
            cp .temp/nats-server-bin/nats-server "${delivery_dir}/nats-server"
            (cd "${delivery_dir}" && sha256sum nats-server > nats-server-binary.sha256)
          fi

      - name: Prepare NATS snapshot evidence context
        if: always()
        shell: bash
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          snapshot_dir="${artifact_dir}/snapshot"
          mkdir -p "${snapshot_dir}"
          for name in environment.txt test-output.txt test-status.txt; do
            if [[ -f "${artifact_dir}/${name}" ]]; then
              cp "${artifact_dir}/${name}" "${snapshot_dir}/${name}"
            fi
          done
          if [[ -f .temp/nats-server-bin/nats-server ]]; then
            cp .temp/nats-server-bin/nats-server "${snapshot_dir}/nats-server"
            (cd "${snapshot_dir}" && sha256sum nats-server > nats-server-binary.sha256)
          fi

      - name: Prepare NATS restart evidence context
        if: always()
        shell: bash
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          restart_dir="${artifact_dir}/restart"
          mkdir -p "${restart_dir}"
          for name in environment.txt test-output.txt test-status.txt; do
            if [[ -f "${artifact_dir}/${name}" ]]; then
              cp "${artifact_dir}/${name}" "${restart_dir}/${name}"
            fi
          done
          if [[ -f "${restart_dir}/environment.txt" ]]; then
            sed -i '1s/^contract=.*/contract=nats-jetstream-restart-recovery/' "${restart_dir}/environment.txt"
          fi
          if [[ -f .temp/nats-server-bin/nats-server ]]; then
            cp .temp/nats-server-bin/nats-server "${restart_dir}/nats-server"
            (cd "${restart_dir}" && sha256sum nats-server > nats-server-binary.sha256)
          fi

      - name: Prepare NATS cluster evidence context
        if: always()
        shell: bash
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          cluster_dir="${artifact_dir}/cluster"
          mkdir -p "${cluster_dir}"
          for name in environment.txt test-output.txt test-status.txt; do
            if [[ -f "${artifact_dir}/${name}" ]]; then
              cp "${artifact_dir}/${name}" "${cluster_dir}/${name}"
            fi
          done
          if [[ -f "${cluster_dir}/environment.txt" ]]; then
            sed -i '1s/^contract=.*/contract=nats-jetstream-cluster-failover/' "${cluster_dir}/environment.txt"
          fi
          if [[ -f .temp/nats-server-bin/nats-server ]]; then
            cp .temp/nats-server-bin/nats-server "${cluster_dir}/nats-server"
            (cd "${cluster_dir}" && sha256sum nats-server > nats-server-binary.sha256)
          fi

      - name: Generate NATS delivery contract evidence
        if: always()
        run: yarn nats:delivery:contract:evidence

      - name: Verify NATS delivery contract evidence
        if: always()
        run: yarn nats:delivery:contract:verify

      - name: Generate NATS restart contract evidence
        if: always()
        run: yarn nats:restart:contract:evidence

      - name: Verify NATS restart contract evidence
        if: always()
        run: yarn nats:restart:contract:verify

      - name: Generate NATS cluster contract evidence
        if: always()
        run: yarn nats:cluster:contract:evidence

      - name: Verify NATS cluster contract evidence
        if: always()
        run: yarn nats:cluster:contract:verify

      - name: Generate NATS snapshot contract evidence
        if: always()
        run: yarn nats:snapshot:contract:evidence

      - name: Verify NATS snapshot contract evidence
        if: always()
        run: yarn nats:snapshot:contract:verify

      - name: Finalize NATS contract checksums
        if: always()
        shell: bash
        run: |
          artifact_dir=".temp/workflow-artifacts/nats-contract"
          find "${artifact_dir}" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "${artifact_dir}/SHA256SUMS"

      - name: Generate NATS evidence manifest
        if: always()
        run: >-
          node scripts/evidence-manifest.mjs
          --output .temp/workflow-artifacts/nats-contract/manifest.json

      - name: Verify NATS evidence manifest
        if: always()
        run: >-
          node scripts/evidence-verify.mjs
          --manifest .temp/workflow-artifacts/nats-contract/manifest.json

      - name: Upload NATS contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nats-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/nats-contract
          if-no-files-found: error
          retention-days: 30

  redis-sentinel-contract:
    needs: module-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache-dependency-path: Framework/go.sum

      - name: Run Redis Sentinel ACL failover contract
        run: yarn redis:sentinel:contract

      - name: Verify Redis Sentinel contract evidence
        if: always()
        run: yarn redis:sentinel:contract:verify

      - name: Upload Redis Sentinel contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redis-sentinel-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/redis-sentinel-contract
          if-no-files-found: error
          retention-days: 30

  local-recovery-drill:
    needs: module-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Framework/go.mod
          cache-dependency-path: |
            Framework/go.sum
            Solutions/Example/go.sum

      - name: Run bounded local server recovery drill
        run: yarn drill:server:evidence

      - name: Verify local server recovery evidence
        if: always()
        run: yarn drill:server:verify

      - name: Generate recovery evidence manifest
        if: always()
        run: yarn evidence:manifest --output .temp/recovery/server-local/manifest.json

      - name: Verify recovery evidence manifest
        if: always()
        run: yarn evidence:verify --manifest .temp/recovery/server-local/manifest.json

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-recovery-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/recovery/server-local
          if-no-files-found: error
          retention-days: 30

  audit-chain-contract:
    needs: module-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Go
