  server-release-provenance:
    needs: module-quality
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.13
          cache-dependency-path: |
            Framework/go.sum
            Solutions/Example/go.sum

      - name: Build deterministic Linux server release
        env:
          SERVER_RELEASE_REQUIRE_CLEAN: "true"
        run: yarn release:server:build

      - name: Verify release manifest and checksum
        run: yarn release:server:verify

      - name: Verify release output is reproducible across separate build directories
        run: yarn release:server:reproducible

      - name: Generate signed build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: .temp/server-release/SHA256SUMS

      - name: Verify signed build provenance
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          release_root=".temp/server-release"
          mkdir -p "${release_root}"
          status=1
          if [[ "${ATTEST_OUTCOME}" == "success" && -f "${ATTESTATION_BUNDLE}" ]]; then
            cp "${ATTESTATION_BUNDLE}" "${release_root}/provenance.bundle.json"
            printf '%s\n' "${ATTESTATION_URL}" > "${release_root}/attestation-url.txt"
            artifact="$(jq -r '.subject.name' "${release_root}/release-manifest.json")"
            subjects=(
              "${artifact}"
              "release-manifest.json"
              "source-manifest.json"
              "reproducibility-report.json"
            )
            status=0
            : > "${release_root}/attestation-verification.txt"
            set +e
            set -o pipefail
            for subject in "${subjects[@]}"; do
              printf 'subject=%s\n' "${subject}" | tee -a "${release_root}/attestation-verification.txt"
              gh attestation verify "${release_root}/${subject}" --repo "${GITHUB_REPOSITORY}" 2>&1 | tee -a "${release_root}/attestation-verification.txt"
              subject_status="${PIPESTATUS[0]}"
              printf 'subject_exit_code=%s\n' "${subject_status}" | tee -a "${release_root}/attestation-verification.txt"
              if [[ "${subject_status}" -ne 0 ]]; then
                status="${subject_status}"
              fi
            done
            set -e
          else
            printf 'attestation action outcome: %s\n' "${ATTEST_OUTCOME}" > "${release_root}/attestation-verification.txt"
          fi
          printf 'exit_code=%s\n' "${status}" > "${release_root}/attestation-status.txt"
          exit "${status}"

      - name: Generate release evidence manifest
        if: always()
        run: yarn evidence:manifest --output .temp/server-release/evidence-manifest.json

      - name: Verify release evidence manifest
        if: always()
        run: yarn evidence:verify --manifest .temp/server-release/evidence-manifest.json

      - name: Upload signed server release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goexample-server-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/server-release
          if-no-files-found: error
          retention-days: 30
