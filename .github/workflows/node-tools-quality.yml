name: Node tools quality

on:
  push:
    paths:
      - "scripts/**"
      - "tools/**"
      - "SDK/**"
      - "support/consumer/**"
      - "contracts/**"
      - "__test__/node/**"
      - "docs/openapi/**"
      - "support/deploy/kubernetes/**"
      - "support/deploy/edge/**"
      - "support/deploy/prometheus/**"
      - "docs/observability/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/**"
      - "!.github/workflows/msfront-*.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "SDK/**"
      - "support/consumer/**"
      - "contracts/**"
      - "__test__/node/**"
      - "docs/openapi/**"
      - "support/deploy/kubernetes/**"
      - "support/deploy/edge/**"
      - "support/deploy/prometheus/**"
      - "docs/observability/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/**"
      - "!.github/workflows/msfront-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-tools-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.13
          cache-dependency-path: |
            Framework/go.sum
            Solutions/Example/go.sum
            tools/actionlint/go.sum
            tools/promtool/go.sum

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint non-MSFront GitHub workflows
        run: yarn workflow:lint

      - name: Verify workflow lint evidence
        run: yarn workflow:lint:verify

      - name: Upload workflow lint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/workflow-lint
          if-no-files-found: error
          retention-days: 30

      - name: Validate Prometheus config and rules with pinned promtool
        run: yarn prometheus:rules

      - name: Verify Prometheus config and rule evidence
        run: yarn prometheus:rules:verify

      - name: Upload Prometheus config and rule evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prometheus-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/prometheus-rules
          if-no-files-found: error
          retention-days: 30

      - name: Test root Node tools
        run: yarn test:node

      - name: Materialize pinned project OpenAPI contracts
        run: yarn contracts:materialize --fetch

      - name: Validate project OpenAPI contract manifest
        run: yarn contracts:check

      - name: Verify generated Go SDK
        run: yarn sdk:check

      - name: Generate SDK release readiness evidence
        run: yarn sdk:release:evidence

      - name: Verify SDK release readiness evidence
        if: always()
        run: yarn sdk:release:evidence:verify

      - name: Upload SDK release readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/sdk-release-readiness
          if-no-files-found: error
          retention-days: 30

      - name: Generate SDK consumer migration evidence
        run: yarn sdk:consumer:evidence

      - name: Verify SDK consumer migration evidence
        if: always()
        run: yarn sdk:consumer:evidence:verify

      - name: Upload SDK consumer migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-consumer-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/sdk-consumer-migration
          if-no-files-found: error
          retention-days: 30

      - name: Verify SDK consumer migration matrix
        run: yarn sdk:matrix:check

      - name: Generate SDK consumer migration matrix evidence
        run: yarn sdk:matrix:evidence

      - name: Verify SDK consumer migration matrix evidence
        if: always()
        run: yarn sdk:matrix:evidence:verify

      - name: Upload SDK consumer migration matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-consumer-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/sdk-consumer-matrix
          if-no-files-found: error
          retention-days: 30

      - name: Generate deterministic Kubernetes deployment evidence
        run: yarn kubernetes:evidence

      - name: Verify Kubernetes deployment evidence
        run: yarn kubernetes:evidence:verify

      - name: Upload Kubernetes deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/kubernetes-manifest
          if-no-files-found: error
          retention-days: 30

      - name: Verify Nginx edge contract
        run: yarn edge:check

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: yarn openapi:compat --base-ref "${OPENAPI_BASE_REF}" --all-projects

  nginx-edge-contract:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Run real Nginx TLS and lifecycle contract
        run: yarn edge:contract

      - name: Verify Nginx edge contract evidence
        if: always()
        run: yarn edge:contract:verify

      - name: Upload Nginx edge contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nginx-edge-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/nginx-edge-contract
          if-no-files-found: error
          retention-days: 30
