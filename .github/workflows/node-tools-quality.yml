name: Node tools quality

on:
  push:
    paths:
      - "scripts/**"
      - "tools/**"
      - "__test__/node/**"
      - "docs/openapi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/node-tools-quality.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "__test__/node/**"
      - "docs/openapi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/node-tools-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-tools-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test root Node tools
        run: yarn test:node

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: yarn openapi:compat --base-ref "${OPENAPI_BASE_REF}"
