name: Node tools quality

on:
  push:
    paths:
      - "scripts/**"
      - "tools/**"
      - "SDK/**"
      - "support/consumer/**"
      - "contracts/**"
      - "__test__/node/**"
      - "docs/openapi/**"
      - "support/deploy/kubernetes/**"
      - "support/deploy/edge/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/node-tools-quality.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "SDK/**"
      - "support/consumer/**"
      - "contracts/**"
      - "__test__/node/**"
      - "docs/openapi/**"
      - "support/deploy/kubernetes/**"
      - "support/deploy/edge/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/node-tools-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-tools-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.13
          cache-dependency-path: |
            Framework/go.sum
            Solutions/Example/go.sum

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test root Node tools
        run: yarn test:node

      - name: Materialize pinned project OpenAPI contracts
        run: yarn contracts:materialize --fetch

      - name: Validate project OpenAPI contract manifest
        run: yarn contracts:check

      - name: Verify generated Go SDK
        run: yarn sdk:check

      - name: Verify Kubernetes deployment contract
        run: yarn kubernetes:check

      - name: Verify Nginx edge contract
        run: yarn edge:check

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: yarn openapi:compat --base-ref "${OPENAPI_BASE_REF}" --all-projects

  nginx-edge-contract:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Run real Nginx TLS and lifecycle contract
        run: yarn edge:contract

      - name: Upload Nginx edge contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nginx-edge-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: .temp/workflow-artifacts/nginx-edge-contract
          if-no-files-found: error
          retention-days: 30
