groups:
  - name: goexample.sli
    interval: 30s
    rules:
      - record: goexample:http_requests:rate5m
        expr: sum(rate(goexample_http_requests_total[5m]))
      - record: goexample:sli:admission_rejection_rate5m
        expr: rate(goexample_http_admission_rejections_total[5m])
      - record: goexample:sli:draining_rejection_rate5m
        expr: rate(goexample_http_draining_rejections_total[5m])
      - record: goexample:http_server_connection_utilization_ratio
        expr: goexample_http_server_connections / goexample_http_server_connection_capacity
      - record: goexample:otel:trace_export_failure_rate5m
        expr: rate(goexample_otel_trace_export_batches_total{outcome="failure"}[5m])
      - record: goexample:otel:trace_export_attempt_failure_rate5m
        expr: rate(goexample_otel_trace_export_attempts_total{outcome="failure"}[5m])
      - record: goexample:otel:trace_queue_drop_rate5m
        expr: rate(goexample_otel_trace_queue_dropped_spans_total[5m])
      - record: goexample:otel:trace_processor_utilization_ratio
        expr: goexample_otel_trace_processor_pending_spans / goexample_otel_trace_processor_capacity_spans
      - record: goexample:security:login_rate_limited_rate5m
        expr: sum(rate(goexample_security_events_total{event="login",outcome="limited"}[5m]))
      - record: goexample:security:audit_sink_failure_rate5m
        expr: sum(rate(goexample_security_audit_sink_writes_total{outcome="failure"}[5m]))
      - record: goexample:queue:delivery_retry_rate5m
        expr: rate(goexample_queue_delivery_events_total{event="retried"}[5m])
      - record: goexample:queue:delivery_dead_letter_rate5m
        expr: rate(goexample_queue_delivery_events_total{event="dead_lettered"}[5m])
      - record: goexample:queue:settlement_failure_rate5m
        expr: rate(goexample_queue_delivery_events_total{event="settlement_failed"}[5m])
      - record: goexample:queue:lease_extension_failure_rate5m
        expr: rate(goexample_queue_delivery_lease_events_total{event="failure"}[5m])
      - record: goexample:http_requests:rate30m
        expr: sum(rate(goexample_http_requests_total[30m]))
      - record: goexample:http_requests:rate1h
        expr: sum(rate(goexample_http_requests_total[1h]))
      - record: goexample:http_requests:rate6h
        expr: sum(rate(goexample_http_requests_total[6h]))
      - record: goexample:http_requests:rate3d
        expr: sum(rate(goexample_http_requests_total[3d]))
      - record: goexample:sli:availability_ratio5m
        expr: sum(rate(goexample_http_requests_total{status!~"5.."}[5m])) / sum(rate(goexample_http_requests_total[5m]))
      - record: goexample:sli:availability_ratio30m
        expr: sum(rate(goexample_http_requests_total{status!~"5.."}[30m])) / sum(rate(goexample_http_requests_total[30m]))
      - record: goexample:sli:availability_ratio1h
        expr: sum(rate(goexample_http_requests_total{status!~"5.."}[1h])) / sum(rate(goexample_http_requests_total[1h]))
      - record: goexample:sli:availability_ratio6h
        expr: sum(rate(goexample_http_requests_total{status!~"5.."}[6h])) / sum(rate(goexample_http_requests_total[6h]))
      - record: goexample:sli:availability_ratio3d
        expr: sum(rate(goexample_http_requests_total{status!~"5.."}[3d])) / sum(rate(goexample_http_requests_total[3d]))
      - record: goexample:sli:availability_error_ratio5m
        expr: 1 - goexample:sli:availability_ratio5m
      - record: goexample:sli:availability_error_ratio30m
        expr: 1 - goexample:sli:availability_ratio30m
      - record: goexample:sli:availability_error_ratio1h
        expr: 1 - goexample:sli:availability_ratio1h
      - record: goexample:sli:availability_error_ratio6h
        expr: 1 - goexample:sli:availability_ratio6h
      - record: goexample:sli:availability_error_ratio3d
        expr: 1 - goexample:sli:availability_ratio3d
      - record: goexample:sli:latency_le_250ms_ratio5m
        expr: sum(rate(goexample_http_request_duration_seconds_bucket{le="0.25",status!~"5.."}[5m])) / sum(rate(goexample_http_request_duration_seconds_count{status!~"5.."}[5m]))
      - record: goexample:sli:latency_p95_seconds5m
        expr: histogram_quantile(0.95, sum by (le) (rate(goexample_http_request_duration_seconds_bucket{status!~"5.."}[5m])))
      - record: goexample:slo:availability_burn_rate5m
        expr: goexample:sli:availability_error_ratio5m / 0.001
      - record: goexample:slo:availability_burn_rate30m
        expr: goexample:sli:availability_error_ratio30m / 0.001
      - record: goexample:slo:availability_burn_rate1h
        expr: goexample:sli:availability_error_ratio1h / 0.001
      - record: goexample:slo:availability_burn_rate6h
        expr: goexample:sli:availability_error_ratio6h / 0.001
      - record: goexample:slo:availability_burn_rate3d
        expr: goexample:sli:availability_error_ratio3d / 0.001

  - name: goexample.slo.alerts
    interval: 30s
    rules:
      - alert: GoExampleAvailabilityBurnRateCritical
        expr: goexample:slo:availability_burn_rate1h > 14.4 and goexample:slo:availability_burn_rate5m > 14.4
        for: 5m
        labels:
          service: goexample
          severity: critical
        annotations:
          summary: GoExample availability error budget is burning rapidly
          description: The 1h and 5m error-budget burn rates exceed 14.4x for 5m.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleAvailabilityBurnRateWarning
        expr: goexample:slo:availability_burn_rate6h > 6 and goexample:slo:availability_burn_rate30m > 6
        for: 15m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample availability error budget is burning above warning threshold
          description: The 6h and 30m error-budget burn rates exceed 6x for 15m.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleLatencySLOViolation
        expr: goexample:sli:latency_p95_seconds5m > 0.25
        for: 10m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample p95 latency is above 250ms
          description: The request p95 latency SLI has exceeded the 250ms objective for 10m.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleHTTPConnectionSaturation
        expr: goexample:http_server_connection_utilization_ratio > 0.9 and goexample_http_server_connection_capacity > 0
        for: 10m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample standard HTTP server is close to its connection limit
          description: More than 90 percent of accepted connection capacity has remained occupied for 10m; new connections may wait before application middleware.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleTraceExportFailures
        expr: goexample:otel:trace_export_failure_rate5m > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample trace batches are failing to export
          description: Final OTLP batch exports have failed continuously; traces may be missing even when requests succeed.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleTraceExportAttemptFailures
        expr: goexample:otel:trace_export_attempt_failure_rate5m > 0.01
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample OTLP export attempts are repeatedly failing
          description: OTLP HTTP attempts are failing at more than 0.01 per second even if bounded retries recover final batches.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleTraceQueueDrops
        expr: goexample:otel:trace_queue_drop_rate5m > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample trace spans are being dropped before export
          description: The bounded trace processor has dropped spans continuously because its capacity was exhausted.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleTraceProcessorSaturation
        expr: goexample:otel:trace_processor_utilization_ratio > 0.8 and goexample_otel_trace_processor_capacity_spans > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample trace processor is close to capacity
          description: More than 80 percent of trace processor capacity has remained occupied for 5m; span drops may follow.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleQueueDeliveryDeadLetters
        expr: goexample:queue:delivery_dead_letter_rate5m > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample queue deliveries are being dead-lettered
          description: Reliable-delivery handlers have continuously exhausted retry or rejected messages as non-retryable for 5m.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleQueueSettlementFailures
        expr: goexample:queue:settlement_failure_rate5m > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample queue delivery settlement is failing
          description: Acknowledgement or dead-letter callbacks have continuously failed, timed out, or panicked for 5m; affected workers stop fail closed.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleQueueLeaseExtensionFailures
        expr: goexample:queue:lease_extension_failure_rate5m > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample queue delivery lease extension is failing
          description: Configured delivery lease-extension callbacks have continuously failed, timed out, or panicked for 5m; affected workers stop before settlement.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/observability/SLO-and-alerts.md
      - alert: GoExampleAuthenticationRateLimited
        expr: goexample:security:login_rate_limited_rate5m > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample login rate limiting is persistently active
          description: The configured authentication limiter has continuously rejected login attempts for 5m; review privacy-minimized security audit events.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/security/server-audit-events.md
      - alert: GoExampleSecurityAuditSinkFailures
        expr: goexample:security:audit_sink_failure_rate5m > 0
        for: 5m
        labels:
          service: goexample
          severity: warning
        annotations:
          summary: GoExample security audit sink writes are failing
          description: The configured security audit sink has continuously returned errors, timed out, or panicked for 5m; HTTP results remain isolated but external audit records may be missing.
          runbook_url: https://github.com/zbxing/goexample/blob/main/docs/security/server-audit-events.md
